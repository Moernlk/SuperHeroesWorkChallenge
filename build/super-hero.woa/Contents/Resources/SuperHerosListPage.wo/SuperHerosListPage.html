<webobjects name="Layout">



  <div class="table-title">
    <h2>Super Heroes</h2>
  </div>

  <wo:WOConditional condition="$temSucesso">
	   <div class="table-title">
	    <p class="msg-sucesso"><wo:WOString value="$sucesso" /></p>
	   </div>
  </wo:WOConditional>

  <div class="table-title" style="margin:5px;"><wo:WOHyperlink action="$openForm">Add new hero</wo:WOHyperlink></div>


  <div class="area-tables">
  <wo:WOConditional condition="$listaVazia" negate="true">
    <table class="table">
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Strength</th>
        <th>Actions</th>
      </tr>
      <webobjects name="FetcherRepetition">
        <tr>
          <td><wo:WOString value="$superHeroAtual.name" /></td>
          <td><wo:WOString value="$superHeroAtual.ability.description" /></td>
          <td><wo:WOString value="$superHeroAtual.ability.strenth" /></td>
          <td id="action-area">
			<wo:WOHyperlink class="inner-btn-table-area" action="$delete"><wo:WOImage class="inner-btn-table" framework="app" filename="delete.png" /></wo:WOHyperlink>	
			<wo:WOHyperlink class="inner-btn-table-area" action="$edit"><wo:WOImage class="inner-btn-table" framework="app" filename="edit.png" /></wo:WOHyperlink>	
          </td>
        </tr>
      </webobjects>
    </table>
  </wo:WOConditional>

  <wo:WOConditional condition="$listaVazia">
    <div class="table-title"><p>No heroes registered</p></div>
  </wo:WOConditional>


  <wo:WOConditional condition="$showForm">
    <div class="form-box">
    	<div class="table-title">
      <h3>New hero</h3>
      	</div>

      <wo:WOConditional condition="$temErro">
        <div class="table-title"><p class="msg-erro"><wo:WOString value="$erro" /></p></div>
      </wo:WOConditional>

       <div class="table-div">
       <wo:WOForm>
        <table class="table">
          <tr>
            <th>Name</th>
            <th>Power</th>
          </tr>
          <tr>
            <td><wo:WOTextField value="$superHeroNovo.name" size="40" /></td>

            <td><webobjects name="NewLinePower" /></td>
          </tr>
        </table>

        <div class="inner-header">
        <wo:WOSubmitButton id="header-btn" class="button" action="$save" value="Salvar" />
        <wo:WOSubmitButton id="header-btn" class="button" action="$cancel" value="Cancelar" />
        </div>

      </wo:WOForm>
     </div>
    </div>
  </wo:WOConditional>
</div>
</webobjects>
